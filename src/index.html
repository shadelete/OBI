<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Output Bazis Info</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-logo">OBI</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" onclick="openProject()">Відкрити замовлення</button>
        <button class="btn btn-secondary" onclick="saveProject()">Зберегти замовлення</button>
        <button class="btn btn-export" onclick="exportExcel()">Експорт Excel</button>
      </div>
      <div class="window-controls">
        <button class="win-btn win-min" onclick="windowMinimize()" title="Згорнути">─</button>
        <button class="win-btn win-close" onclick="windowClose()" title="Закрити">✕</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="materials" onclick="switchTab('materials')">
        Матеріали та кромка <span class="tab-count" id="count-materials">0</span>
      </div>
      <div class="tab" data-tab="profiles" onclick="switchTab('profiles')">
        Профілі <span class="tab-count" id="count-profiles">0</span>
      </div>
      <div class="tab" data-tab="fittings" onclick="switchTab('fittings')">
        Фурнітура <span class="tab-count" id="count-fittings">0</span>
      </div>
    </div>
    <div class="content">
      <div class="stats" id="stats"></div>
      <div class="panel active" id="panel-materials">
        <div class="section-title">Матеріали та кромка</div>
        <div id="materials-list" class="card-list"></div>
      </div>
      <div class="panel" id="panel-profiles">
        <div class="section-title">Профілі</div>
        <div id="profiles-list" class="card-list"></div>
      </div>
      <div class="panel" id="panel-fittings">
        <div class="section-title">Фурнітура</div>
        <div class="add-form" id="add-fitting-form">
          <div class="form-row">
            <input class="form-input" id="fit-name" placeholder="Найменування фурнітури">
            <input class="form-input form-input-sm" id="fit-code" placeholder="Артикул">
            <input class="form-input form-input-sm" id="fit-count" type="number" min="1" placeholder="К-сть">
            <select class="form-input form-input-tag" id="fit-tag"></select>
            <button class="btn btn-primary" onclick="addFitting()">Додати</button>
          </div>
        </div>
        <div class="tag-manager">
          <span class="tag-manager-label">Управління тегами:</span>
          <input class="form-input form-input-sm form-input-tag-new" id="new-tag-input" placeholder="Новий тег">
          <button class="btn btn-primary" onclick="addTag()">Додати тег</button>
        </div>
        <div id="fittings-columns" class="fit-columns"></div>
        <div id="fittings-list" class="card-list" style="display:none;"></div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
