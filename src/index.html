<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Output Bazis Info</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-logo">OBI</span>
        </div>
        <div class="project-name" id="project-name"></div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary" onclick="openProject()" data-i18n="open.project"></button>
        <button class="btn btn-secondary" onclick="saveProject()" data-i18n="save.project"></button>
        <button class="btn btn-secondary" onclick="openCalcModal()" data-i18n="calc.button"></button>
        <button class="btn btn-export" onclick="exportExcel()" data-i18n="export.excel"></button>
        <button class="btn btn-icon settings-btn" id="settings-btn" title="Налаштування">⚙</button>
      </div>
      <div class="window-controls">
        <button class="win-btn win-min" onclick="windowMinimize()" title="Згорнути">─</button>
        <button class="win-btn win-max" onclick="windowMaximize()" title="Розгорнути">□</button>
        <button class="win-btn win-close" onclick="windowClose()" title="Закрити">✕</button>
      </div>
    </div>

    <div class="workspace">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
          <div class="nav-item active" data-cat="materials" onclick="switchCat('materials')">
            <span class="nav-label" data-i18n="tab.materials"></span>
            <span class="nav-badge" id="badge-materials">0</span>
          </div>
          <div class="nav-item" data-cat="profiles" onclick="switchCat('profiles')">
            <span class="nav-label" data-i18n="tab.profiles"></span>
            <span class="nav-badge" id="badge-profiles">0</span>
          </div>
          <div class="nav-item" data-cat="fittings" onclick="switchCat('fittings')">
            <span class="nav-label" data-i18n="tab.fittings"></span>
            <span class="nav-badge" id="badge-fittings">0</span>
          </div>
        </nav>
        <div class="sidebar-stats" id="sidebar-stats"></div>
      </aside>

      <!-- LIST PANEL -->
      <section class="list-panel">
        <div class="list-header">
          <div class="list-title" id="list-title" data-i18n="tab.materials"></div>
          <div class="list-search">
            <input class="search-input" id="search-input" placeholder="Пошук...">
          </div>
        </div>
        <div class="list-body" id="list-body"></div>
        <div class="list-footer">
          <button class="btn btn-primary btn-add" id="btn-add" data-i18n="mat.add"></button>
        </div>
      </section>

      <!-- DETAIL PANEL -->
      <section class="detail-panel">
        <div class="detail-header" id="detail-header"></div>
        <div class="detail-tabs" id="detail-tabs"></div>
        <div class="detail-content" id="detail-content"></div>
        <div class="detail-stats" id="detail-stats"></div>

        <!-- Fittings workspace (persistent, shown when category = fittings) -->
        <div class="fittings-detail" id="fittings-detail" style="display:none;">
          <div class="fittings-wrap">
            <!-- Header -->
            <div class="fw-header">
              <div class="fw-header-left">
                <div class="fw-title" data-i18n="fw.title">Фурнітура</div>
                <div class="fw-subtitle" data-i18n="fw.subtitle">Керування номенклатурою фурнітури в проєкті</div>
              </div>
              <div class="fw-header-right">
                <div class="fw-tag-controls">
                  <span class="fw-tag-controls-label" data-i18n="fw.tags.manage">Управління тегами</span>
                  <input class="fw-input fw-input-tag-new" id="new-tag-input" data-i18n-ph="tags.new.placeholder">
                  <button class="btn btn-primary" onclick="addTag()" data-i18n="tags.add"></button>
                </div>
                <div class="fw-actions">
                  <button class="btn btn-secondary" onclick="sortFittings('code')" data-i18n="fw.sort.article">Артикул</button>
                  <button class="btn btn-secondary" onclick="sortFittings('count')" data-i18n="fw.sort.count">К-сть</button>
                  <button class="btn btn-primary" onclick="saveFwChanges()" data-i18n="fw.save">Зберегти</button>
                </div>
              </div>
            </div>

            <!-- Search -->
            <div class="fw-search">
              <span class="fw-search-icon">🔍</span>
              <input class="fw-search-input" id="fw-search-input" data-i18n-ph="fw.search.placeholder">
            </div>

            <!-- Tabs -->
            <div class="fw-tabs" id="fw-tabs"></div>

            <!-- Main workspace -->
            <div class="fw-main">
              <div class="fw-columns" id="fittings-columns"></div>
              <div class="fw-sidebar">
                <div class="fw-sidebar-title" data-i18n="fw.sidebar.title">Додавання позиції</div>
                <div class="fw-sidebar-form">
                  <label class="fw-field">
                    <span class="fw-field-label" data-i18n="fw.field.category">Категорія</span>
                    <select class="fw-input" id="fw-add-tag"></select>
                  </label>
                  <label class="fw-field">
                    <span class="fw-field-label" data-i18n="fw.field.name">Назва</span>
                    <input class="fw-input" id="fw-add-name" data-i18n-ph="fw.field.name.placeholder">
                  </label>
                  <label class="fw-field">
                    <span class="fw-field-label" data-i18n="fw.field.code">Артикул</span>
                    <input class="fw-input" id="fw-add-code" data-i18n-ph="fw.field.code.placeholder">
                  </label>
                  <label class="fw-field">
                    <span class="fw-field-label" data-i18n="fw.field.supplier">Постачальник</span>
                    <select class="fw-input" id="fw-add-supplier">
                      <option value="">—</option>
                      <option value="Owwa">Owwa</option>
                      <option value="Viyar">Viyar</option>
                      <option value="Blum">Blum</option>
                    </select>
                  </label>
                  <label class="fw-field">
                    <span class="fw-field-label" data-i18n="fw.field.count">К-сть</span>
                    <input class="fw-input" id="fw-add-count" type="number" min="1" value="1">
                  </label>
                  <button class="btn btn-primary fw-add-btn" onclick="addFittingFromSidebar()" data-i18n="fw.add.btn">Додати позицію</button>
                  <button class="btn fw-clear-btn" onclick="clearFwForm()" data-i18n="fw.clear.btn">Очистити форму</button>
                </div>
              </div>
            </div>

            <!-- Footer -->
            <div class="fw-footer">
              <div class="fw-footer-left" id="fw-selected-label">Вибрано позицій: 0</div>
              <div class="fw-footer-center">
                <button class="btn btn-danger" id="fw-delete-btn" onclick="deleteSelectedFittings()" data-i18n="fw.delete.selected">Видалити вибрані (0)</button>
              </div>
              <div class="fw-footer-right" id="fw-total-label">Загальна кількість: 0</div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- PROJECT PICKER MODAL -->
  <div class="modal-overlay" id="project-picker-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" data-i18n="project.open"></span>
        <button class="btn btn-icon modal-close" id="project-picker-close" title="Закрити">✕</button>
      </div>
      <div class="modal-body">
        <div class="project-list" id="project-list"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeProjectPicker()" data-i18n="settings.close"></button>
      </div>
    </div>
  </div>

  <!-- CALC (workbook) MODAL -->
  <div class="modal-overlay" id="calc-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" data-i18n="calc.title"></span>
        <button class="btn btn-icon modal-close" id="calc-modal-close" title="Закрити">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <div class="settings-label" data-i18n="calc.file.label"></div>
          <div class="calc-file-row">
            <button class="btn btn-secondary" id="calc-choose-btn" onclick="chooseCalcWorkbook()" data-i18n="calc.file.choose"></button>
            <span class="calc-file-name" id="calc-file-name" data-i18n="calc.file.none"></span>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="calc.room.label"></div>
          <div class="calc-room-row">
            <input class="form-input" id="calc-room-input" data-i18n-ph="calc.room.placeholder">
            <button class="btn btn-secondary" id="calc-room-auto" onclick="setCalcRoomAuto()" data-i18n="calc.room.default"></button>
          </div>
          <div class="calc-room-hint" id="calc-room-hint"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCalcModal()" data-i18n="settings.close"></button>
        <button class="btn btn-primary" id="calc-write-btn" onclick="writeCalcWorkbook()" data-i18n="calc.write"></button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" data-i18n="settings.title"></span>
        <button class="btn btn-icon modal-close" id="settings-close" title="Закрити">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.theme"></div>
          <div class="settings-options">
            <label class="settings-option">
              <input type="radio" name="theme" id="settings-theme-light" value="light" checked>
              <span data-i18n="settings.theme.light"></span>
            </label>
            <label class="settings-option">
              <input type="radio" name="theme" id="settings-theme-dark" value="dark">
              <span data-i18n="settings.theme.dark"></span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.language"></div>
          <div class="settings-options">
            <label class="settings-option">
              <input type="radio" name="language" id="settings-lang-uk" value="uk" checked>
              <span data-i18n="settings.language.uk"></span>
            </label>
            <label class="settings-option">
              <input type="radio" name="language" id="settings-lang-ru" value="ru">
              <span data-i18n="settings.language.ru"></span>
            </label>
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.rules"></div>
          <button class="btn btn-primary" id="open-fit-rules-btn" onclick="openFitRulesWindow()" data-i18n="settings.rules.open">Відкрити</button>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.tags.per.row"></div>
          <div class="settings-options settings-tpr">
            <input type="number" id="settings-tags-per-row" min="1" max="6" step="1">
          </div>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.updates"></div>
          <label class="settings-option settings-checkbox">
            <input type="checkbox" id="settings-updates-auto">
            <span data-i18n="settings.updates.auto"></span>
          </label>
          <div class="updates-actions">
            <button class="btn btn-secondary" id="updates-check-btn" onclick="checkUpdates()" data-i18n="settings.updates.check">Перевірити</button>
            <button class="btn btn-primary" id="updates-apply-btn" onclick="applyUpdates()" style="display:none" data-i18n="settings.updates.apply">Оновити</button>
          </div>
          <div class="updates-status" id="updates-status"></div>
        </div>
        <div class="settings-section">
          <div class="settings-label" data-i18n="settings.about"></div>
          <div class="settings-meta">
            <div class="meta-row">
              <span class="meta-label" data-i18n="settings.version"></span>
              <span class="meta-value" id="settings-version-value">—</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="settings.author"></span>
              <span class="meta-value" id="settings-author-value">—</span>
            </div>
            <div class="meta-row">
              <span class="meta-label" data-i18n="settings.github"></span>
              <a class="meta-value meta-link" id="settings-github-link" href="#" target="_blank">—</a>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeSettings()" data-i18n="settings.close"></button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
